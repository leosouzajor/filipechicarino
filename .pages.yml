media:
  input: public/images
  output: /images
  rename: safe

content:
  - name: artigos
    label: Artigos
    type: collection
    path: content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"

    view:
      primary: title
      sort: date
      order: desc

    fields:
      - name: title
        label: Título
        type: string
        required: true

      - name: subtitle
        label: Subtítulo
        type: string

      - name: date
        label: Data
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: readTime
        label: Tempo de leitura
        type: string
        description: "Ex: 5 min"

      - name: author
        label: Autor
        type: string
        required: true

      - name: excerpt
        label: Resumo
        type: text

      - name: coverImage
        label: Imagem de capa
        type: image
        required: true
        media:
          input: public/images/blog
          output: /images/blog

      - name: seoTitle
        label: Título SEO
        type: string

      - name: seoDescription
        label: Descrição SEO
        type: text

      - name: body
        label: Corpo do artigo
        type: rich-text
        required: true
        media:
          input: public/images/blog
          output: /images/blog
        options:
          format: markdown
          switcher: true
