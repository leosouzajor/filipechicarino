media:
  input: public/images
  output: /images
  rename: safe

content:
  - name: artigos
    label: Artigos
    type: collection
    path: content/blog
    format: frontmatter
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: subtitle
        label: Subtítulo
        type: string
      - name: date
        label: Data
        type: date
        options:
          format: yyyy-MM-dd
      - name: readTime
        label: Tempo de leitura
        type: string
        description: "Ex: 5 min de leitura"
      - name: excerpt
        label: Resumo
        type: text
      - name: coverImage
        label: Imagem de capa
        type: image
        media:
          input: public/images/blog
          output: /images/blog
      - name: seoTitle
        label: Título SEO
        type: string
      - name: seoDescription
        label: Descrição SEO
        type: string
      - name: body
        label: Corpo do artigo
        type: rich-text
        media:
          input: public/images/blog
          output: /images/blog
