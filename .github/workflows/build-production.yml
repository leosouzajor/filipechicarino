name: Build and Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:static

      - name: Verify static build output
        run: |
          if [ ! -f "dist/client/index.html" ]; then
            echo "Error: dist/client/index.html not found!"
            exit 1
          fi
          if [ ! -f "dist/client/blog/index.html" ]; then
            echo "Error: dist/client/blog/index.html not found!"
            exit 1
          fi
          if [ ! -d "dist/client/images" ]; then
            echo "Error: dist/client/images not found!"
            exit 1
          fi
          if [ ! -d "dist/client/assets" ]; then
            echo "Error: dist/client/assets not found!"
            exit 1
          fi
          if [ ! -f "dist/client/sitemap.xml" ]; then
            echo "Error: dist/client/sitemap.xml not found!"
            exit 1
          fi
          if [ ! -f "dist/client/robots.txt" ]; then
            echo "Error: dist/client/robots.txt not found!"
            exit 1
          fi
          
          # Verify that every Markdown article has a corresponding HTML page
          for md_file in content/blog/*.md; do
            slug=$(basename "$md_file" .md)
            if [ ! -f "dist/client/blog/$slug/index.html" ]; then
              echo "Error: dist/client/blog/$slug/index.html not found!"
              exit 1
            fi
          done
          
          echo "All verifications passed!"

      - name: Deploy to production branch
        run: |
          cd dist/client
          git init
          git checkout -b production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy production build"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git production
